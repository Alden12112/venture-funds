services:
  - type: web
    name: venture-funds
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    pullRequestPreviewsEnabled: true
    envVars:
      - key: APP_SURFACE
        value: frontend
      - key: VITE_APP_SURFACE
        value: frontend
      - key: AUTH_SECRET
        generateValue: true
      - key: VENTURE_FUNDS_ADMIN_EMAIL
        sync: false
      - key: VENTURE_FUNDS_ADMIN_PASSWORD
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: OANDA_PRACTICE_ACCOUNT_ID
        sync: false
      - key: OANDA_PRACTICE_TOKEN
        sync: false
      - key: MT5_INGEST_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: venture-funds-postgres-oregon
          property: connectionString
  - type: web
    name: venture-funds-admin
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    pullRequestPreviewsEnabled: false
    envVars:
      - key: APP_SURFACE
        value: admin
      - key: VITE_APP_SURFACE
        value: admin
      - key: REMOTE_API_ORIGIN
        value: https://venture-funds.onrender.com
      - key: AUTH_SECRET
        fromService:
          type: web
          name: venture-funds
          envVarKey: AUTH_SECRET
      - key: VENTURE_FUNDS_ADMIN_EMAIL
        sync: false
      - key: VENTURE_FUNDS_ADMIN_PASSWORD
        sync: false

databases:
  # The existing web services are hosted in Oregon, so this colocated store
  # provides persistent state shared by the frontend and admin service.
  - name: venture-funds-postgres-oregon
    databaseName: venture_funds_oregon
    user: venture_funds
    region: oregon
    plan: free
