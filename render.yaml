services:
  - type: web
    name: ad88-platform
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    pullRequestPreviewsEnabled: true
    envVars:
      - key: APP_SURFACE
        value: frontend
      - key: VITE_APP_SURFACE
        value: frontend
      - key: AUTH_SECRET
        generateValue: true
      - key: AD88_ADMIN_EMAIL
        sync: false
      - key: AD88_ADMIN_PASSWORD
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ad88-postgres
          property: connectionString
  - type: web
    name: ad88-admin
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    pullRequestPreviewsEnabled: false
    envVars:
      - key: APP_SURFACE
        value: admin
      - key: VITE_APP_SURFACE
        value: admin
      - key: REMOTE_API_ORIGIN
        value: https://ad88-platform.onrender.com
      - key: AUTH_SECRET
        fromService:
          type: web
          name: ad88-platform
          envVarKey: AUTH_SECRET
      - key: AD88_ADMIN_EMAIL
        sync: false
      - key: AD88_ADMIN_PASSWORD
        sync: false

databases:
  - name: ad88-postgres
    databaseName: ad88
    user: ad88
    plan: free
